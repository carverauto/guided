# Gateway API replacement for guided production.
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: guided-prod-tls
  namespace: guided
spec:
  secretName: guided-prod-tls
  issuerRef:
    kind: ClusterIssuer
    name: carverauto-issuer
  commonName: guided.dev
  dnsNames:
    - guided.dev
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: guided-prod-edge
  namespace: guided
spec:
  logging:
    level:
      default: warn
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: LoadBalancer
        externalTrafficPolicy: Local
        annotations:
          metallb.universe.tf/address-pool: k3s-pool
        patch:
          type: StrategicMerge
          value:
            spec:
              ipFamilies:
                - IPv4
              ipFamilyPolicy: SingleStack
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: guided-prod-envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: guided-prod-edge
    namespace: guided
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: guided-prod-gateway
  namespace: guided
spec:
  gatewayClassName: guided-prod-envoy
  listeners:
    - name: http
      hostname: guided.dev
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      hostname: guided.dev
      port: 443
      protocol: HTTPS
      tls:
        certificateRefs:
          - kind: Secret
            name: guided-prod-tls
        mode: Terminate
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: guided-prod
  namespace: guided
  annotations:
    external-dns.alpha.kubernetes.io/hostname: guided.dev
spec:
  parentRefs:
    - name: guided-prod-gateway
      namespace: guided
      sectionName: https
  hostnames:
    - guided.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: guided-web
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: guided-prod-http-redirect
  namespace: guided
spec:
  parentRefs:
    - name: guided-prod-gateway
      namespace: guided
      sectionName: http
  hostnames:
    - guided.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: guided-prod-route-policy
  namespace: guided
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: guided-prod
  timeout:
    http:
      requestTimeout: 120s
  requestBuffer:
    limit: 50Mi
